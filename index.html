<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16212b"><title>Sagor's Chatroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e4dc;--bg2:#f6f2ec;--panel:#fffdf9;--ink:#1c2630;--muted:#6f7a84;--line:#e4ddd2;--accent:#1f3447;--on-accent:#fff;--gold:#b8894d;--soft:#efe9df;--soft-ink:#1c2630;--bubble:#efe9df;--mine:#1f3447;--mine-ink:#fff;--input:#fff;--hover:#f6f1e9;--danger:#b24545;--shadow:0 10px 40px #1c263014}
.dark{--bg:#0d141b;--bg2:#121b24;--panel:#17222c;--ink:#e9edf0;--muted:#8c99a5;--line:#263543;--accent:#c9a46a;--on-accent:#15202a;--gold:#c9a46a;--soft:#223140;--soft-ink:#e9edf0;--bubble:#223140;--mine:#c9a46a;--mine-ink:#15202a;--input:#101a23;--hover:#1d2a36;--danger:#d26a6a;--shadow:0 10px 40px #00000066}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Hind Siliguri",system-ui,sans-serif;transition:background .25s,color .25s}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:14px;padding:11px 16px;background:var(--accent);color:var(--on-accent);font-weight:600;transition:transform .12s,opacity .2s}
button:active{transform:scale(.97)}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.secondary{background:var(--soft);color:var(--soft-ink)}
.icon{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:12px;font-size:18px;flex:none}
.hidden{display:none!important}
.brand{font-family:Sora,"Hind Siliguri",sans-serif;font-weight:800;font-size:21px;letter-spacing:-.5px}
.muted{color:var(--muted);font-size:13px}
input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--input);color:var(--ink);outline:none;transition:border-color .2s}
input:focus{border-color:var(--gold)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1;min-width:0}
.grow{flex:1;min-width:0}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* change own password */
$("pwBtn").onclick=()=>{$("pwErr").classList.add("hidden");$("pwDlg").showModal()};$("pwCancel").onclick=()=>$("pwDlg").close();
$("pwForm").onsubmit=async e=>{e.preventDefault();try{await reauthenticateWithCredential(me,EmailAuthProvider.credential(alias(profile.id),$("pwCur").value));await updatePassword(me,$("pwNew").value);$("pwForm").reset();$("pwDlg").close();toast("পাসওয়ার্ড পরিবর্তন হয়েছে")}catch(err){$("pwErr").textContent="পরিবর্তন হয়নি। বর্তমান পাসওয়ার্ড ঠিক আছে কিনা দেখুন।";$("pwErr").classList.remove("hidden")}};

/* auth */
#authView{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 15% -10%,#b8894d33,transparent),radial-gradient(700px 500px at 100% 100%,#1f344733,transparent)}
.auth{width:100%;max-width:410px;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:30px 26px;box-shadow:var(--shadow)}
.logo{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 22px Sora;margin-bottom:16px}
.tabs{display:flex;background:var(--soft);padding:4px;border-radius:16px;margin:20px 0 4px}
.tabs button{flex:1;background:transparent;color:var(--muted);padding:10px}
.tabs button.active{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px #0000001a}
.form button{width:100%;margin-top:18px;padding:14px}
.notice{padding:11px 14px;border-radius:14px;background:var(--soft);color:var(--ink);margin-top:14px;font-size:14px}

/* app shell */
#appView{height:100dvh;display:flex;flex-direction:column;max-width:780px;margin:auto;padding:14px}
.top{display:flex;align-items:center;gap:12px;padding:4px 4px 14px}
.me{display:flex;align-items:center;gap:11px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#8c6a3a);color:#fff;font-weight:700;flex:none;font-size:17px}
.avatar.sm{width:36px;height:36px;font-size:14px}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:16px 16px 10px}
#searchResult{margin-top:10px}
.found{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--soft);color:var(--soft-ink);padding:10px 12px}
.section-title{font-size:12px;font-weight:600;color:var(--muted);padding:6px 20px}
#inboxList{overflow:auto;flex:1;padding:4px 8px 10px}
.userline{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;cursor:pointer;transition:background .15s}
.userline:hover{background:var(--hover)}.userline.active{background:var(--soft)}
.userline b{font-weight:600}
.badge{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--gold);color:#15202a;font-size:12px;font-weight:700;display:grid;place-items:center}
.time{font-size:11px;color:var(--muted)}
.userline.unread .muted{color:var(--ink);font-weight:600}
.emptyList{padding:28px 16px;text-align:center;color:var(--muted)}

/* chat */
.chat{background:var(--bg2);display:none}.layout.chat-open .side{display:none}.layout.chat-open .chat{display:flex}
#welcome{margin:auto;text-align:center;color:var(--muted);padding:30px}
#welcome .big{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;background:var(--soft);display:grid;place-items:center;font-size:34px}
#chatArea{display:flex;flex-direction:column;height:100%;min-height:0}
.chathead{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#backBtn{display:grid}
.messages{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:76%;padding:9px 13px 7px;border-radius:18px 18px 18px 6px;background:var(--bubble);color:var(--ink);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.bubble.mine{background:var(--mine);color:var(--mine-ink);border-radius:18px 18px 6px 18px;align-self:flex-end}
.bubble small{display:block;text-align:right;font-size:10.5px;opacity:.7;margin-top:2px;white-space:normal}
.send{display:flex;gap:8px;padding:12px;background:var(--panel);border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom))}
.send input{flex:1;border-radius:22px}.send button{border-radius:22px;padding:0 22px}

dialog{border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--ink);padding:22px;width:min(92vw,380px);box-shadow:var(--shadow)}dialog::backdrop{background:#0009}
/* toast */
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-120%);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);z-index:50;max-width:92vw;width:340px;cursor:pointer;transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
#toast.show{transform:translate(-50%,0)}

@media(max-width:820px){#appView{padding:0}.top{padding:12px 14px}.card{border-radius:0;border-left:0;border-right:0;box-shadow:none}.bubble{max-width:86%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="toast"></div>
<section id="authView">
 <div class="auth">
  <div class="logo">S</div><div class="brand">Sagor's Chatroom</div><p class="muted" style="margin:4px 0 0">নিরাপদ ও ব্যক্তিগত কথোপকথন</p>
  <div class="tabs"><button id="loginTab" class="active" type="button">লগইন</button><button id="registerTab" type="button">রেজিস্ট্রেশন</button></div>
  <form id="loginForm" class="form"><label>১৬ সংখ্যার User ID</label><input id="loginId" inputmode="numeric" maxlength="16" required><label>Password</label><input id="loginPass" type="password" required><button>লগইন করুন</button></form>
  <form id="registerForm" class="form hidden"><label>Nickname</label><input id="regName" maxlength="30" required><label>১৬ সংখ্যার User ID</label><input id="regId" inputmode="numeric" maxlength="16" required><label>Password (কমপক্ষে ৬ অক্ষর)</label><input id="regPass" type="password" minlength="6" required><button>রেজিস্ট্রেশন পাঠান</button></form>
  <div id="authMsg" class="notice hidden"></div>
 </div>
</section>

<section id="appView" class="hidden">
 <header class="top">
  <div class="me"><div class="avatar" id="meAvatar">S</div><div><div class="brand" style="font-size:18px">Sagor's Chatroom</div><div class="muted" id="myIdentity"></div></div></div>
  <div class="grow"></div>
  <button class="secondary icon" id="notifBtn" title="নোটিফিকেশন চালু করুন">🔔</button>
  <button class="secondary icon" id="themeBtn" title="থিম">🌙</button>
  <button class="secondary icon" id="pwBtn" title="পাসওয়ার্ড পরিবর্তন">🔑</button>
  <button class="secondary" id="logoutBtn">লগআউট</button>
 </header>
 <div class="layout" id="layout">
  <aside class="card side">
   <div class="side-head"><div class="row"><input id="searchId" inputmode="numeric" maxlength="16" placeholder="১৬ সংখ্যার ID দিয়ে খুঁজুন"><button id="searchBtn">খুঁজুন</button></div><div id="searchResult"></div></div>
   <div class="section-title">চ্যাট</div>
   <div id="inboxList"></div>
  </aside>
  <section class="card chat">
   <div id="welcome"><div class="big">💬</div><b>একটি চ্যাট বেছে নিন</b><div class="muted">অথবা User ID দিয়ে কাউকে খুঁজে নতুন চ্যাট শুরু করুন</div></div>
   <div id="chatArea" class="hidden">
    <div class="chathead"><button class="secondary icon" id="backBtn" aria-label="ফিরে যান">←</button><div class="avatar sm" id="chatAvatar">?</div><div class="grow"><b id="chatName" class="truncate" style="display:block">Chat</b><div class="muted" id="chatSub"></div></div></div>
    <div id="messages" class="messages"></div>
    <form id="sendForm" class="send"><input id="messageInput" placeholder="মেসেজ লিখুন..." autocomplete="off" maxlength="2000" required><button>পাঠান</button></form>
   </div>
  </section>
 </div>
</section>

<dialog id="pwDlg"><form id="pwForm"><b style="font-size:17px">পাসওয়ার্ড পরিবর্তন</b><label>বর্তমান পাসওয়ার্ড</label><input id="pwCur" type="password" autocomplete="current-password" required><label>নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="pwNew" type="password" minlength="6" autocomplete="new-password" required><div id="pwErr" class="notice hidden"></div><div class="row" style="margin-top:16px"><button type="button" class="secondary" id="pwCancel" style="flex:1">বাতিল</button><button style="flex:1">সেভ করুন</button></div></form></dialog>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence,updatePassword,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {getDatabase,ref,get,set,update,push,onValue,query,limitToLast,increment} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyC8aJLxFDydqDkaF3RPGdSXr6RLGXd0Bs",authDomain:"assanger-51e65.firebaseapp.com",databaseURL:"https://assanger-51e65-default-rtdb.firebaseio.com",projectId:"assanger-51e65",storageBucket:"assanger-51e65.firebasestorage.app",messagingSenderId:"887503433353",appId:"1:887503433353:web:8255955b0d958ea88e2058",measurementId:"G-5J5CC8HKNZ"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
await setPersistence(auth,browserLocalPersistence);
const $=id=>document.getElementById(id),alias=id=>id+"@sagorchat.app",validId=id=>/^\d{16}$/.test(id);
let me=null,profile=null,currentChat=null,currentPeer=null,offMessages=null,offInbox=null,prevChats={},firstLoad=true,inboxData={};
const baseTitle=document.title;
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

/* theme */
function setTheme(d){document.body.classList.toggle("dark",d);$("themeBtn").textContent=d?"☀️":"🌙";document.querySelector('meta[name=theme-color]').content=d?"#0d141b":"#16212b";try{localStorage.setItem("theme",d?"dark":"light")}catch(e){}}
let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
setTheme(saved?saved==="dark":matchMedia("(prefers-color-scheme:dark)").matches);
$("themeBtn").onclick=()=>setTheme(!document.body.classList.contains("dark"));

/* notifications */
const canNotify="Notification"in window;
function syncBell(){$("notifBtn").style.opacity=(canNotify&&Notification.permission==="granted")?1:.6}
$("notifBtn").onclick=async()=>{if(!canNotify)return toast("এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই");const p=await Notification.requestPermission();syncBell();toast(p==="granted"?"নোটিফিকেশন চালু হয়েছে":"নোটিফিকেশন বন্ধ আছে")};
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.15,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.35);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.36)}catch(e){}}
let toastTimer=null;
function toast(msg,onclick){const t=$("toast");t.textContent=msg;t.onclick=onclick||null;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),4000)}
function notify(id,d){
 const open=()=>{window.focus();openChat(id,d)};
 beep();
 if(!document.hidden)toast((d.title||"নতুন মেসেজ")+": "+(d.lastMessage||""),open);
 if(navigator.vibrate)navigator.vibrate([120,60,120]);
 if(canNotify&&Notification.permission==="granted"&&document.hidden){const t=d.title||"নতুন মেসেজ",o={body:d.lastMessage||"",tag:id,renotify:true};
  const fallback=()=>{try{const n=new Notification(t,o);n.onclick=()=>{open();n.close()}}catch(e){}};
  if("serviceWorker"in navigator)navigator.serviceWorker.getRegistration().then(r=>r?r.showNotification(t,o):fallback()).catch(fallback);else fallback()}
}
function updateTitle(){const n=Object.values(inboxData).reduce((s,d)=>s+(d.unread||0),0);document.title=n?`(${n}) ${baseTitle}`:baseTitle}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&currentChat)clearUnread(currentChat)});

/* auth */
const say=m=>{$("authMsg").textContent=m;$("authMsg").classList.remove("hidden")};
function tab(w){$("loginForm").classList.toggle("hidden",w!=="login");$("registerForm").classList.toggle("hidden",w!=="register");$("loginTab").classList.toggle("active",w==="login");$("registerTab").classList.toggle("active",w==="register");$("authMsg").classList.add("hidden")}
$("loginTab").onclick=()=>tab("login");$("registerTab").onclick=()=>tab("register");
$("registerForm").onsubmit=async e=>{e.preventDefault();const name=$("regName").value.trim(),id=$("regId").value.trim(),password=$("regPass").value;if(!validId(id))return say("User ID অবশ্যই ১৬ সংখ্যার হতে হবে।");try{const exists=await get(ref(db,"idIndex/"+id));if(exists.exists())return say("এই User ID আগে থেকেই ব্যবহৃত।");const cred=await createUserWithEmailAndPassword(auth,alias(id),password);const uid=cred.user.uid,now=Date.now();await set(ref(db,"users/"+uid),{uid,id,nickname:name,status:"pending",createdAt:now});await set(ref(db,"idIndex/"+id),uid);await set(ref(db,"registrationRequests/"+uid),{uid,id,nickname:name,status:"pending",createdAt:now});await signOut(auth);say("রেজিস্ট্রেশন জমা হয়েছে। Admin অনুমোদন করলে লগইন করতে পারবেন।");tab("login")}catch(err){say(err.message)}};
$("loginForm").onsubmit=async e=>{e.preventDefault();const id=$("loginId").value.trim();if(!validId(id))return say("সঠিক ১৬ সংখ্যার User ID দিন।");try{await signInWithEmailAndPassword(auth,alias(id),$("loginPass").value);if(canNotify&&Notification.permission==="default")Notification.requestPermission().then(syncBell)}catch(err){say("লগইন হয়নি: User ID বা Password ভুল।")}};
$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
 if(!user){me=null;profile=null;currentChat=null;if(offInbox)offInbox();if(offMessages)offMessages();$("authView").classList.remove("hidden");$("appView").classList.add("hidden");document.title=baseTitle;return}
 const s=await get(ref(db,"users/"+user.uid));
 if(!s.exists()){await signOut(auth);say("এই অ্যাকাউন্টটি মুছে ফেলা হয়েছে বা পাওয়া যায়নি।");return}
 if(s.val().status!=="active"){await signOut(auth);say("আপনার অ্যাকাউন্ট এখনো Admin অনুমোদন করেনি অথবা নিষ্ক্রিয়।");return}
 me=user;profile=s.val();firstLoad=true;prevChats={};
 $("authView").classList.add("hidden");$("appView").classList.remove("hidden");
 $("myIdentity").textContent=profile.nickname+" · "+profile.id;$("meAvatar").textContent=profile.nickname.slice(0,1).toUpperCase();syncBell();loadInbox();
});

/* inbox */
const chatId=(a,b)=>[a,b].sort().join("_");
const fmt=t=>t?new Date(t).toLocaleTimeString("bn-BD",{hour:"numeric",minute:"2-digit"}):"";
function addInboxItem(id,d){
 const el=document.createElement("div");el.className="userline"+(d.unread?" unread":"")+(id===currentChat?" active":"");
 const av=document.createElement("div");av.className="avatar";av.textContent=(d.title||"C").slice(0,1).toUpperCase();
 const g=document.createElement("div");g.className="grow";const b=document.createElement("b");b.className="truncate";b.style.display="block";b.textContent=d.title||"Chat";
 const m=document.createElement("div");m.className="muted truncate";m.textContent=d.lastMessage||"নতুন কথোপকথন";g.append(b,m);
 const side=document.createElement("div");side.style.cssText="display:flex;flex-direction:column;align-items:flex-end;gap:4px";
 const t=document.createElement("span");t.className="time";t.textContent=fmt(d.updatedAt);side.append(t);
 if(d.unread>0){const bd=document.createElement("span");bd.className="badge";bd.textContent=d.unread>99?"99+":d.unread;side.append(bd)}
 el.append(av,g,side);el.onclick=()=>openChat(id,d);$("inboxList").append(el)
}
function loadInbox(){
 if(offInbox)offInbox();
 offInbox=onValue(ref(db,"userChats/"+me.uid),snap=>{
  const all=snap.val()||{},v={};Object.entries(all).forEach(([k,d])=>{if(d.type==="private")v[k]=d});inboxData=v;
  $("inboxList").replaceChildren();
  const list=Object.entries(v).sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0));
  if(!list.length){const e=document.createElement("div");e.className="emptyList";e.textContent="এখনো কোনো চ্যাট নেই। ID দিয়ে কাউকে খুঁজে শুরু করুন।";$("inboxList").append(e)}
  list.forEach(([id,d])=>addInboxItem(id,d));
  if(!firstLoad){list.forEach(([id,d])=>{const p=prevChats[id];if(d.unread>0&&(!p||(d.updatedAt||0)>(p.updatedAt||0))){if(id===currentChat&&!document.hidden)clearUnread(id);else notify(id,d)}})}
  updateTitle();if(firstLoad){const n=Object.values(v).reduce((x,d)=>x+(d.unread||0),0);if(n){toast(`আপনার ${n}টি অপঠিত মেসেজ আছে`);beep()}}prevChats=v;firstLoad=false;
 })
}
function clearUnread(id){if(me&&inboxData[id]?.unread>0)update(ref(db,"userChats/"+me.uid+"/"+id),{unread:0}).catch(()=>{})}

/* search */
async function findUser(){
 const id=$("searchId").value.trim(),out=$("searchResult");out.replaceChildren();
 const msg=t=>{out.innerHTML="";const d=document.createElement("div");d.className="muted";d.textContent=t;out.append(d)};
 if(!validId(id))return msg("১৬ সংখ্যার ID লিখুন");
 if(id===profile.id)return msg("নিজের ID দিয়ে খোঁজা যাবে না");
 try{const ix=await get(ref(db,"idIndex/"+id));if(!ix.exists())return msg("ইউজার পাওয়া যায়নি");
  const u=await get(ref(db,"users/"+ix.val()));if(!u.exists()||u.val().status!=="active")return msg("ইউজার পাওয়া যায়নি");
  const d=u.val(),btn=document.createElement("button");btn.className="found secondary";
  const av=document.createElement("div");av.className="avatar sm";av.textContent=d.nickname.slice(0,1).toUpperCase();
  const tx=document.createElement("div");tx.innerHTML="<b></b><div class='muted'></div>";tx.querySelector("b").textContent=d.nickname;tx.querySelector(".muted").textContent=d.id;
  btn.append(av,tx);btn.onclick=()=>{startPrivate(d);out.replaceChildren();$("searchId").value=""};out.append(btn)
 }catch(e){msg("খোঁজা যায়নি: "+e.message)}
}
$("searchBtn").onclick=findUser;$("searchId").onkeydown=e=>{if(e.key==="Enter")findUser()};

async function startPrivate(peer){
 const id=chatId(me.uid,peer.uid),data={type:"private",peerUid:peer.uid,title:peer.nickname,peerId:peer.id};
 const u={};Object.entries(data).forEach(([k,v])=>u["userChats/"+me.uid+"/"+id+"/"+k]=v);
 if(!inboxData[id])u["userChats/"+me.uid+"/"+id+"/updatedAt"]=Date.now();
 await update(ref(db),u);openChat(id,data)
}

/* chat */
function openChat(id,data){
 currentChat=id;currentPeer=data;
 $("welcome").classList.add("hidden");$("chatArea").classList.remove("hidden");$("layout").classList.add("chat-open");
 $("chatName").textContent=data.title||"Chat";$("chatSub").textContent="ID: "+(data.peerId||"");$("chatAvatar").textContent=(data.title||"C").slice(0,1).toUpperCase();
 document.querySelectorAll(".userline").forEach(n=>n.classList.remove("active"));
 clearUnread(id);
 if(offMessages)offMessages();
 offMessages=onValue(query(ref(db,"messages/"+id),limitToLast(150)),snap=>{
  const box=$("messages");box.replaceChildren();
  if(snap.exists())Object.entries(snap.val()).forEach(([k,m])=>{
   const b=document.createElement("div");b.className="bubble"+(m.from===me.uid?" mine":"");
   const body=document.createElement("div");body.textContent=m.text;
   const meta=document.createElement("small");meta.textContent=fmt(m.createdAt)+(m.from===me.uid?(m.seen?" ✓✓":" ✓"):"");
   b.append(body,meta);box.append(b);
   if(m.from!==me.uid&&!m.seen&&!document.hidden)update(ref(db,"messages/"+id+"/"+k),{seen:true}).catch(()=>{});
  });
  box.scrollTop=box.scrollHeight;if(!document.hidden)clearUnread(id)
 });
 $("messageInput").focus({preventScroll:true})
}
$("backBtn").onclick=()=>{$("layout").classList.remove("chat-open");currentChat=null;if(offMessages){offMessages();offMessages=null}$("chatArea").classList.add("hidden");$("welcome").classList.remove("hidden")};
$("sendForm").onsubmit=async e=>{
 e.preventDefault();const text=$("messageInput").value.trim();if(!text||!currentChat)return;$("messageInput").value="";
 const now=Date.now(),id=currentChat,peer=currentPeer;
 try{
  await push(ref(db,"messages/"+id),{from:me.uid,fromName:profile.nickname,text,createdAt:now,seen:false});
  const u={},mine="userChats/"+me.uid+"/"+id+"/",theirs="userChats/"+peer.peerUid+"/"+id+"/";
  u[mine+"lastMessage"]=text;u[mine+"updatedAt"]=now;
  u[theirs+"type"]="private";u[theirs+"peerUid"]=me.uid;u[theirs+"title"]=profile.nickname;u[theirs+"peerId"]=profile.id;
  u[theirs+"lastMessage"]=text;u[theirs+"updatedAt"]=now;u[theirs+"unread"]=increment(1);
  await update(ref(db),u)
 }catch(err){toast("মেসেজ পাঠানো যায়নি: "+err.message);$("messageInput").value=text}
};
</script></body></html>
